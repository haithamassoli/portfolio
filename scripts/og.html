<!doctype html>
<!--
  Source for public/og.png. Regenerate by opening this file at 1200x630 and
  screenshotting it:
    npx playwright screenshot --viewport-size=1200,630 \
      "file://$PWD/scripts/og.html" public/og.png
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Thmanyah Sans';
				src: url('../src/assets/fonts/thmanyahsans-Black.woff2') format('woff2');
				font-weight: 900;
			}
			@font-face {
				font-family: 'Thmanyah Sans';
				src: url('../src/assets/fonts/thmanyahsans-Light.woff2') format('woff2');
				font-weight: 300;
			}

			* {
				margin: 0;
				box-sizing: border-box;
			}

			/* Linen, ink, one indigo thread: the main design's own cloth. */
			body {
				width: 1200px;
				height: 630px;
				padding: 4.5rem 4.75rem;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				background:
					repeating-linear-gradient(
						90deg,
						rgba(22, 23, 29, 0.05) 0 1px,
						transparent 1px 11px
					),
					repeating-linear-gradient(
						180deg,
						rgba(22, 23, 29, 0.05) 0 1px,
						transparent 1px 11px
					),
					#f3efe6;
				color: #16171d;
				font-family: 'Thmanyah Sans', system-ui, sans-serif;
				overflow: hidden;
			}

			.eyebrow {
				display: flex;
				align-items: center;
				gap: 1rem;
				font-family: ui-monospace, SFMono-Regular, monospace;
				font-size: 1.1rem;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				color: #4b4c57;
			}

			.eyebrow::before {
				content: '';
				width: 2.5rem;
				height: 3px;
				background: #1d35d1;
			}

			/* The name, set in threads. */
			h1 {
				font-size: 7.4rem;
				font-weight: 900;
				line-height: 0.95;
				letter-spacing: -0.03em;
				color: transparent;
				background: repeating-linear-gradient(
					180deg,
					#1d35d1 0 0.075em,
					#8a94e6 0.075em 0.1em
				);
				-webkit-background-clip: text;
				background-clip: text;
			}

			.ar {
				margin-top: 0.6rem;
				font-size: 2.6rem;
				font-weight: 900;
				direction: rtl;
				text-align: left;
			}

			p {
				font-weight: 300;
				font-size: 1.55rem;
				line-height: 1.4;
				color: #4b4c57;
				max-width: 34ch;
				margin-top: 1.4rem;
			}

			.url {
				font-family: ui-monospace, SFMono-Regular, monospace;
				font-size: 1.15rem;
				color: #8a8b96;
			}
		</style>
	</head>
	<body>
		<span class="eyebrow">Full-stack web &amp; mobile engineer · Amman</span>
		<div>
			<h1>Haitham Assoli</h1>
			<div class="ar">هيثم العسولي</div>
			<p>
				Web, iOS and Android products, in Arabic and English. Forty shipped.
			</p>
		</div>
		<span class="url">assoli.site</span>
	</body>
</html>
